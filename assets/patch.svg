<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="414" viewBox="0 0 1200 414">
  <rect width="1200" height="414" fill="#14161a"/>
  <text x="36" y="34" font-family="Menlo, Consolas, monospace" font-size="15" fill="#9aa3ad">a real patch: one word changed in a nine-line text, exactly as makefun-diff 1.0.0 writes it</text>
  <text x="36" y="58" font-family="Menlo, Consolas, monospace" font-size="21" fill="#c9d1d9">makefun-diff/1 old=9 new=9 hunks=1 deleted=1 inserted=1</text><text x="36" y="92" font-family="Menlo, Consolas, monospace" font-size="21" fill="#d4a017">@ 1 7 1 7</text><text x="36" y="126" font-family="Menlo, Consolas, monospace" font-size="21" fill="#c9d1d9">=alpha</text><text x="36" y="160" font-family="Menlo, Consolas, monospace" font-size="21" fill="#c9d1d9">=beta</text><text x="36" y="194" font-family="Menlo, Consolas, monospace" font-size="21" fill="#c9d1d9">=gamma</text><text x="36" y="228" font-family="Menlo, Consolas, monospace" font-size="21" fill="#6ee7a0">-delta</text><text x="36" y="262" font-family="Menlo, Consolas, monospace" font-size="21" fill="#f28b82">+DELTA</text><text x="36" y="296" font-family="Menlo, Consolas, monospace" font-size="21" fill="#c9d1d9">=epsilon</text><text x="36" y="330" font-family="Menlo, Consolas, monospace" font-size="21" fill="#c9d1d9">=zeta</text><text x="36" y="364" font-family="Menlo, Consolas, monospace" font-size="21" fill="#c9d1d9">=eta</text>
</svg>